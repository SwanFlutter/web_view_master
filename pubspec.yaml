name: web_view_master
description: "A comprehensive WebView plugin for Flutter with advanced features including JavaScript support, native web notifications, share functionality, find in page, screenshot capture, CSS injection, page analytics, dark mode detection, and more. Build-stable and cross-platform compatible."
version: 1.1.0
homepage: https://github.com/SwanFlutter/web_view_master
repository: https://github.com/SwanFlutter/web_view_master
issue_tracker: https://github.com/SwanFlutter/web_view_master/issues
documentation: https://github.com/SwanFlutter/web_view_master#readme

environment:
  sdk: ^3.13.1
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0


flutter:

  plugin:
    platforms:
      android:
        package: com.example.web_view_master
        pluginClass: WebViewMasterPlugin
      ios:
        pluginClass: WebViewMasterPlugin
      linux:
        pluginClass: WebViewMasterPlugin
      macos:
        pluginClass: WebViewMasterPlugin
      windows:
        pluginClass: WebViewMasterPluginCApi


